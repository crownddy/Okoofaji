<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OKOO FAJI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #f6f1f1;
    --arch: #d9dfff;
    --circle: #bcc8fb;
    --red: #dc2626;
    --blue: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(circle at 12% 15%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 45%),
      radial-gradient(circle at 90% 90%, rgba(220,38,38,.55) 0%, rgba(220,38,38,0) 50%),
      linear-gradient(135deg, #ffffff 0%, #9db8f5 50%, #f2a3a3 100%);
    background-size: 200% 200%, 200% 200%, 200% 200%;
    animation: drift 14s ease-in-out infinite alternate;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @keyframes drift {
    0%   { background-position: 0% 0%, 100% 100%, 0% 50%; }
    100% { background-position: 100% 100%, 0% 0%, 100% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
  }
  /* Phones: copy and arch share one grid cell, so the text sits on the arch */
  .stage {
    --ink: #101c66;
    --accent: #a60f1a;
    width: 100%;
    display: grid;
    justify-items: center;
    align-items: start;
  }
  .stage > * { grid-area: 1 / 1; }
  .copy {
    --t: min(12.5vw, 80px);
    position: relative;
    z-index: 2;
    width: min(70.4vw, 416px);
    padding-top: clamp(1rem, 5svh, 2.5rem);
    text-align: center;
    pointer-events: none;
  }
  .title {
    margin: 0;
    display: flex;
    justify-content: center;
    gap: .26em;
    font: 400 var(--t)/.95 Anton, Impact, "Arial Narrow", sans-serif;
    letter-spacing: .01em;
    color: var(--ink);
  }
  .word { display: inline-flex; white-space: nowrap; }
  .letter {
    display: inline-block;
    animation: jump .85s cubic-bezier(.22,.9,.3,1) both;
    animation-delay: calc(.3s + var(--i) * .08s);
  }
  .tagline-wrap { overflow: hidden; padding: .25em .5em; margin-top: .25rem; }
  .tagline {
    margin: 0;
    font: italic 500 clamp(.95rem, 4.2vw, 1.35rem)/1.25 "Playfair Display", Georgia, serif;
    color: var(--accent);
    animation: slide .9s cubic-bezier(.2,.75,.25,1) 1.3s both;
  }
  .tagline-wrap + .tagline-wrap { margin-top: 0; }
  .tagline-2 {
    color: var(--ink);
    animation: slideRight .9s cubic-bezier(.2,.75,.25,1) 1.9s both;
  }
  @keyframes slideRight {
    from { transform: translateX(110%); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  .arch-wrap { position: relative; width: min(70.4vw, 416px); }
  /* The arch: flat top bleeding off-screen, fully rounded bottom */
  .arch {
    position: relative;
    width: 100%;
    height: 80vh;
    height: 80svh;
    margin-top: 0;
    background: var(--arch);
    border-radius: 0 0 999px 999px;
    overflow: hidden;
  }
  /* The circle sitting behind the subject */
  .circle {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 100%;
    aspect-ratio: 1;
    transform: translateX(-50%);
    background: var(--circle);
    border-radius: 50%;
  }
  .slides { position: absolute; inset: 0; cursor: pointer; touch-action: pan-y; outline: none; }
  .slide {
    position: absolute;
    left: 50%;
    max-width: none;
    object-fit: contain;
    object-position: center bottom;
    opacity: 0;
    transform: translateX(-50%) translateY(22px) scale(.94);
    transition: opacity .35s ease, transform .35s ease;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 18px 18px rgba(30,40,110,.25));
  }
  .slide.is-active {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
    transition: opacity .6s ease .3s, transform .9s cubic-bezier(.2,.8,.25,1) .3s;
  }
  /* Full-length figures stand on the circle; busts rise out of the arch bottom */
  .slide.full  { width: 112%; height: 69%; bottom: 4%; }
    .slide.bleed { width: 130%; height: 80%; bottom: -2%; }
  /* Previous / next buttons */
  .nav {
    position: absolute;
    z-index: 3;
    top: 56%;
    width: 40px;
    height: 40px;
    margin-top: -20px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.78);
    color: var(--ink);
    box-shadow: 0 4px 14px rgba(16,28,102,.22);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    cursor: pointer;
    transition: transform .2s ease, background .2s ease, opacity .3s ease;
  }
  .nav svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .nav.prev { left: 8px; }
  .nav.next { right: 8px; }
  .nav:hover { background: #fff; transform: scale(1.08); }
  .nav:active { transform: scale(.94); }
  .nav:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .nav:disabled { opacity: .35; cursor: default; pointer-events: none; }
  /* Login button under the arch */
  .login {
    z-index: 2;
    align-self: start;
    margin-top: calc(80vh + 12px);
    margin-top: calc(80svh + 12px);
    height: 40px;
    padding: 0 26px;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font: 500 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: .02em;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(16,28,102,.28);
    transition: transform .2s ease, opacity .3s ease, background .2s ease;
  }
  .login:hover { background: #1b2c8f; transform: translateY(-1px); }
  .login:active { transform: scale(.96); }
  .login:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .login:disabled { opacity: .35; cursor: default; pointer-events: none; }
  .word { position: relative; z-index: 1; }
  .logo {
    --d: calc(var(--t) * 1.05);
    order: -1;
    flex: none;
    position: relative;
    z-index: 0;
    width: var(--d);
    height: var(--d);
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(90deg, #3b277e 6.74%, #4f4288 11.93%, #6d5c9f 17.12%, #8d83b8 24.04%, #b4adcf 32.70%, #ded9ef 41.35%, #fefefe 50.00%, #fdf0f0 58.65%, #fcc5c9 67.30%, #f5999a 75.96%, #ef7775 82.88%, #ed5f58 88.07%, #e84840 93.26%);
    box-shadow: 0 0 0 max(2px, calc(var(--d) * .035)) #fff, 0 8px 20px rgba(16,28,102,.28);
    animation: logoIn 1s cubic-bezier(.2,.8,.25,1) .15s both;
  }
  .logo img { position: absolute; left: 6.74%; top: 0.82%; width: 86.52%; height: auto; display: block; }
  @keyframes logoIn {
    from { transform: translateX(-420%); opacity: 0; }
    35%  { opacity: 1; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes jump {
    0%   { transform: translateY(120%) scale(.6); opacity: 0; }
    45%  { transform: translateY(-16%) scale(1.06); opacity: 1; }
    70%  { transform: translateY(6%) scale(.98); }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes slide {
    from { transform: translateX(-110%); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  /* Tablet, iPad and desktop: text on the left, arch-circle carousel on the right, arrows outside the arch */
  @media (min-width: 768px) {
    .stage {
      --ah: min(80vh, 90vw);
      --ah: min(80svh, 90vw);
      --aw: calc(var(--ah) * .44);
      --pad: clamp(1.5rem, 6vw, 7rem);
      --gap: clamp(1rem, 4vw, 5rem);
      --col: calc(min(100vw, 1800px) - 2 * var(--pad) - var(--aw) - var(--gap));
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: var(--gap);
      padding-inline: var(--pad);
      max-width: 1800px;
      margin-inline: auto;
    }
    .stage > * { grid-area: auto; }
    .copy {
      --t: min(17vw, 27svh, calc(var(--col) / 2.6));
      grid-column: 1;
      grid-row: 1;
      align-self: center;
      width: auto;
      padding-top: 0;
      text-align: left;
    }
    .title {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-areas: "w1 w1" "w2 logo";
      justify-content: start;
      align-items: center;
      gap: 0;
      line-height: .88;
    }
    .title .w1 { grid-area: w1; justify-self: start; }
    .title .w2 { grid-area: w2; }
    .logo { grid-area: logo; --d: calc(var(--t) * .8); order: 0; margin-left: calc(var(--t) * .18); }
    .tagline-wrap { padding-inline: 0 .5em; margin-top: calc(var(--t) * .08); }
    .tagline { font-size: calc(var(--t) * .17); }
    .arch-wrap { grid-column: 2; grid-row: 1; width: var(--aw); display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .arch { flex: 0 0 100%; height: var(--ah); }
    .nav { position: static; top: auto; margin: 0; width: 48px; height: 48px; }
    .nav svg { width: 22px; height: 22px; }
    .login { grid-column: 2; grid-row: 1; margin-top: calc(var(--ah) + 72px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .letter, .tagline, .logo { animation: none; }
    .auth[open], .auth[open]::backdrop { animation: none; }
    .slide, .nav, .login { transition: none; }
  }
  /* Login / register modals */
  .auth {
    --ink: #101c66;
    --accent: #a60f1a;
    --grad: linear-gradient(90deg, #ea8fae, #9279e4);
    width: min(92vw, 390px);
    max-height: 94vh;
    max-height: 94svh;
    margin: auto;
    padding: 0;
    border: 0;
    background: transparent;
    color: #1b1b2f;
    overflow: visible;
    font-family: Poppins, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .auth::backdrop { background: rgba(16,28,102,.45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .auth[open] { animation: authIn .35s cubic-bezier(.2,.8,.25,1) both; }
  .auth[open]::backdrop { animation: authFade .3s ease both; }
  @keyframes authIn { from { opacity: 0; transform: translateY(24px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes authFade { from { opacity: 0; } to { opacity: 1; } }
  .auth-card {
    max-height: 94vh;
    max-height: 94svh;
    overflow-y: auto;
    border-radius: 30px;
    background: #fff;
    box-shadow: 0 30px 80px rgba(16,28,102,.35);
  }
  .auth-card:focus { outline: none; }
  /* Pastel header with fine concentric lines */
  .auth-hero {
    position: relative;
    height: 132px;
    background:
      repeating-radial-gradient(circle at 24% 150%, rgba(255,255,255,.7) 0 1px, rgba(255,255,255,0) 1px 6px),
      repeating-radial-gradient(circle at 90% -35%, rgba(255,255,255,.4) 0 1px, rgba(255,255,255,0) 1px 5px),
      linear-gradient(120deg, #f6c5d1 0%, #e8c8ea 48%, #b8a3f1 100%);
  }
  .auth-back {
    position: absolute; top: 16px; left: 14px;
    display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 4px;
    border: 0; background: none; color: #1b1b2f; font: 500 14px Poppins, system-ui, sans-serif; cursor: pointer;
  }
  .auth-back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .auth-sheet {
    position: relative;
    margin-top: -34px;
    padding: 26px 22px 20px;
    border-radius: 30px 30px 0 0;
    background: #fff;
  }
  .auth-title { margin: 0; text-align: center; color: #0d0d1a; font: 600 26px/1.2 Poppins, system-ui, sans-serif; }
  .auth-sub { margin: 8px 0 0; text-align: center; color: #2b2d42; font: 400 13px/1.5 Poppins, system-ui, sans-serif; }
  .auth-sub strong { display: block; color: #0d0d1a; font-weight: 600; }
  .auth form { margin-top: 20px; }
  .field { display: block; margin-top: 12px; }
  .field:first-child { margin-top: 0; }
  .field input {
    width: 100%; height: 52px; padding: 0 16px;
    border: 1px solid #cdd1e2; border-radius: 14px; background: #fff; color: #1b1b2f;
    font: 400 14px Poppins, system-ui, sans-serif; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input::placeholder { color: #9aa0b4; }
  .field input:focus { border-color: #9279e4; box-shadow: 0 0 0 4px rgba(146,121,228,.18); }
  .field input:user-invalid { border-color: #dc2626; }
  .pw { position: relative; display: block; }
  .pw input { padding-right: 50px; }
  .pw button {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; display: grid; place-items: center;
    border: 0; border-radius: 50%; background: none; color: #a0a5b8; cursor: pointer;
  }
  .pw button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .pw .slash { display: none; }
  .pw button.is-shown .slash { display: block; }
  .pw button.is-shown { color: var(--ink); }
  .auth-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; color: var(--ink); font: 400 12px Poppins, system-ui, sans-serif; }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .check input {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; margin: 0; display: grid; place-items: center;
    border: 1.5px solid var(--ink); border-radius: 4px; background: #fff; cursor: pointer;
  }
  .check input:checked { background: var(--ink); }
  .check input:checked::after { content: ""; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  .check input:focus-visible { outline: 3px solid rgba(146,121,228,.5); outline-offset: 2px; }
  .auth-row .link { font: 400 12px Poppins, system-ui, sans-serif; }
  .auth-primary {
    width: 100%; height: 52px; margin-top: 20px; border: 0; border-radius: 999px;
    background: var(--grad); color: #fff; font: 500 16px Poppins, system-ui, sans-serif;
    box-shadow: 0 8px 18px rgba(146,121,228,.4); cursor: pointer; transition: transform .2s ease, filter .2s ease;
  }
  .auth-primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .auth-primary:active { transform: scale(.98); }
  .auth-note { min-height: 1.3em; margin: 10px 0 0; text-align: center; color: var(--accent); font: 500 12px/1.3 Poppins, system-ui, sans-serif; }
  .auth-or { display: flex; align-items: center; gap: 12px; margin: 8px 0 12px; color: #8a90a6; font: 400 13px Poppins, system-ui, sans-serif; }
  .auth-or::before, .auth-or::after { content: ""; flex: 1; height: 1px; background: #e3e6f0; }
  .socials { display: flex; justify-content: center; gap: 22px; }
  .socials button {
    width: 46px; height: 46px; display: grid; place-items: center;
    border: 0; border-radius: 50%; background: none; cursor: pointer; transition: transform .2s ease, background .2s ease;
  }
  .socials button:hover { transform: translateY(-2px); background: #f3f4fa; }
  .socials svg { width: 32px; height: 32px; }
  .auth-foot { margin: 14px 0 0; text-align: center; color: #1b1b2f; font: 400 13px Poppins, system-ui, sans-serif; }
  .link { padding: 0; border: 0; background: none; color: var(--ink); font: 600 13px Poppins, system-ui, sans-serif; cursor: pointer; }
  .link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .auth button:focus-visible { outline: 3px solid rgba(146,121,228,.6); outline-offset: 2px; }
  @media (max-height: 720px) { .auth-hero { height: 104px; } .auth-sheet { padding-top: 22px; } }
</style>
</head>

<script>
(function () {
  var box = document.querySelector('.slides');
  var slides = Array.prototype.slice.call(box.querySelectorAll('.slide'));
  var prev = document.querySelector('.nav.prev'), next = document.querySelector('.nav.next');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var i = 0, timer = null, startX = null, ready = false;
  function show(n) {
    if (!ready) return;
    slides[i].classList.remove('is-active');
    i = (n + slides.length) % slides.length;
    slides[i].classList.add('is-active');
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  function play() {
    stop();
    if (ready && !reduce.matches && !document.hidden) timer = setInterval(function () { show(i + 1); }, 4200);
  }
  function step(d) { show(i + d); play(); }
  prev.addEventListener('click', function () { step(-1); });
  next.addEventListener('click', function () { step(1); });
  box.addEventListener('pointerdown', function (e) { startX = e.clientX; });
  box.addEventListener('pointercancel', function () { startX = null; });
  box.addEventListener('pointerup', function (e) {
    if (startX === null) return;
    var dx = e.clientX - startX; startX = null;
    step(Math.abs(dx) > 40 ? (dx < 0 ? 1 : -1) : 1);
  });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });
  box.addEventListener('mouseenter', stop);
  box.addEventListener('mouseleave', play);
  document.addEventListener('visibilitychange', play);
  document.addEventListener('okoo:modal', function (e) { if (e.detail.open) stop(); else play(); });
  /* The first photo is already on screen; the rest are filled in once the page has painted. */
  window.carouselReady = function (srcs) {
    var jobs = srcs.map(function (src, k) {
      var el = slides[k + 1];
      el.src = src;
      return el.decode ? el.decode().catch(function () {}) : Promise.resolve();
    });
    Promise.all(jobs).then(function () {
      ready = true;
      prev.disabled = false; next.disabled = false;
      play();
    });
  };
})();
</script>

<script>
(function () {
  var login = document.getElementById('login-modal');
  var register = document.getElementById('register-modal');
  var trigger = document.querySelector('.login');
  var dialogs = [login, register];
  var NAMES = { apple: 'Apple', google: 'Google', facebook: 'Facebook' };
  function announce(open) { document.dispatchEvent(new CustomEvent('okoo:modal', { detail: { open: open } })); }
  function openModal(d) { if (!d.open) d.showModal(); announce(true); }
  function note(form, msg) { form.querySelector('.auth-note').textContent = msg; }
  function hidePasswords(d) {
    d.querySelectorAll('[data-toggle]').forEach(function (b) {
      b.previousElementSibling.type = 'password'; b.classList.remove('is-shown'); b.setAttribute('aria-label', 'Show password');
    });
  }
  trigger.addEventListener('click', function () { openModal(login); });
  dialogs.forEach(function (d) {
    d.addEventListener('click', function (e) { if (e.target === d) d.close(); });   /* backdrop click */
    d.addEventListener('close', function () {
      d.querySelectorAll('form').forEach(function (f) { f.reset(); note(f, ''); });
      hidePasswords(d);
      if (!login.open && !register.open) announce(false);
    });
  });
  document.addEventListener('click', function (e) {
    var sw = e.target.closest('[data-switch]');
    if (sw) {                                       /* hide this modal, open the other */
      var to = sw.getAttribute('data-switch') === 'register' ? register : login;
      var from = to === register ? login : register;
      from.close(); openModal(to);
      var first = to.querySelector('input'); if (first) first.focus();
      return;
    }
    var x = e.target.closest('[data-close]'); if (x) { x.closest('dialog').close(); return; }
    var t = e.target.closest('[data-toggle]');
    if (t) {
      var inp = t.previousElementSibling, show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      t.classList.toggle('is-shown', show);
      t.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      return;
    }
    var fg = e.target.closest('[data-forgot]');
    if (fg) {
      var f1 = fg.closest('form');
      if (window.okooAuth && window.okooAuth.forgot) window.okooAuth.forgot({ email: f1.elements.email.value });
      else note(f1, 'Password reset isn\u2019t connected yet.');
      return;
    }
    var pv = e.target.closest('[data-provider]');
    if (pv) {
      var name = pv.getAttribute('data-provider'), form = pv.closest('.auth-card').querySelector('form');
      if (window.okooAuth && window.okooAuth.provider) window.okooAuth.provider(name);
      else note(form, NAMES[name] + ' sign-in isn\u2019t connected yet.');
    }
  });
  document.querySelectorAll('form[data-form]').forEach(function (form) {
    var confirm = form.elements.confirm;
    function match() { if (confirm) confirm.setCustomValidity(confirm.value && confirm.value !== form.elements.password.value ? 'Passwords do not match' : ''); }
    form.addEventListener('input', function () { match(); note(form, ''); });
    form.addEventListener('submit', function (e) {
      e.preventDefault(); match();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      var kind = form.getAttribute('data-form'), data = {};
      Array.prototype.forEach.call(form.elements, function (el) {
        if (el.name) data[el.name] = el.type === 'checkbox' ? el.checked : el.value;
      });
      if (window.okooAuth && window.okooAuth[kind]) window.okooAuth[kind](data);
      else note(form, (kind === 'login' ? 'Login' : 'Registration') + ' isn\u2019t connected yet.');
    });
  });
})();
</script>
